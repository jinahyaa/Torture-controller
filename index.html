<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovense Controller</title>
  
<script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
  
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .controller {
      width: 100%;
      max-width: 500px;

      background: #1c1c1c;

      border-radius: 20px;

      padding: 25px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin: 20px 0;

      padding: 12px;

      border-radius: 10px;

      background: #2a2a2a;
    }

    .slider-container {
      margin: 30px 0;
    }

    input[type="range"] {
      width: 100%;
    }

    .buttons {
      display: grid;

      grid-template-columns: 1fr 1fr;

      gap: 12px;

      margin-top: 20px;
    }

    button {
      padding: 15px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    #connectButton {
      width: 100%;

      margin-top: 10px;
    }
  </style>
</head>

<body>

  <div class="controller">

    <h1>Our Controller 💕</h1>

    <div
      class="status"
      id="status"
    >
      Backend connecting...
    </div>

    <button
      id="connectButton"
      onclick="connectLovense()"
    >
      Connect Lovense
    </button>

    <div class="slider-container">

      <p>
        Intensity:
        <span id="intensityValue">0</span>
      </p>

      <input
        type="range"
        id="intensity"
        min="0"
        max="20"
        value="0"
      >

    </div>

    <div class="buttons">

      <button onclick="sendCommand('start')">
        Start
      </button>

      <button onclick="sendCommand('stop')">
        Stop
      </button>

    </div>

  </div>

  <script>

    const BACKEND_URL =
      "https://torture-controller.onrender.com";
    
    const PLATFORM = "LiasLittleTorture";

    const statusElement =
      document.getElementById("status");


    const intensitySlider =
      document.getElementById("intensity");


    const intensityValue =
      document.getElementById("intensityValue");


    intensitySlider.addEventListener(
      "input",
      () => {

        intensityValue.textContent =
          intensitySlider.value;

      }
    );


  
async function connectLovense() {

  statusElement.textContent =
    "Getting Lovense authentication...";

  const uid =
    "user-" +
    Math.random()
      .toString(36)
      .substring(2, 12);

  try {

    // Step 1: Get authToken
    const authResponse =
      await fetch(
        `${BACKEND_URL}/auth-token`,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            uid: uid
          })
        }
      );

    const authData =
      await authResponse.json();

    if (
      authData.code !== 0 ||
      !authData.data?.authToken
    ) {

      statusElement.textContent =
        "Authentication failed ❌";

      return;

    }

    const authToken =
      authData.data.authToken;


    // Step 2: Get Socket information
    statusElement.textContent =
      "Getting Lovense connection...";

    const socketResponse =
      await fetch(
        "https://api.lovense-api.com/api/basicApi/getSocketUrl",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body: JSON.stringify({
            platform:
              PLATFORM,

            authToken:
              authToken
          })
        }
      );


    const socketData =
      await socketResponse.json();


    console.log(
      "Socket response:",
      socketData
    );


    if (
      socketData.code === 0
    ) {

      statusElement.textContent =
        "Socket information received ✅";

      console.log(
        "Socket URL:",
        socketData.data
      );

    } else {

      statusElement.textContent =
        "Socket setup failed ❌";

    }

  } catch (error) {

    console.error(
      error
    );

    statusElement.textContent =
      "Connection error ❌";

  }

}

    async function sendCommand(
      command
    ) {

      statusElement.textContent =
        "Command sent: " +
        command;

    }

  </script>

</body>
</html>
