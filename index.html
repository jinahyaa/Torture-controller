<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovense Finger Controller</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .controller {
      width: 100%;
      max-width: 500px;

      background: #1c1c1c;

      border-radius: 20px;

      padding: 25px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin: 20px 0;

      padding: 12px;

      border-radius: 10px;

      background: #2a2a2a;
    }

    #connectButton {
      width: 100%;

      padding: 15px;

      margin-top: 10px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      cursor: pointer;
    }

    #connectButton:active {
      transform: scale(0.97);
    }

    #qrContainer {
      display: none;

      margin: 20px 0;
    }

    #qrCode {
      width: 250px;

      max-width: 100%;

      background: white;

      padding: 10px;

      border-radius: 10px;
    }

    .trace-container {
      margin-top: 30px;
    }

    .trace-label {
      margin-bottom: 12px;

      color: #ccc;
    }

    .trace-pad {
      position: relative;

      width: 100%;

      height: 350px;

      background: #2a2a2a;

      border-radius: 20px;

      border: 2px solid #444;

      touch-action: none;

      overflow: hidden;

      cursor: crosshair;

      user-select: none;

      -webkit-user-select: none;
    }

    .trace-indicator {
      position: absolute;

      width: 34px;

      height: 34px;

      background: white;

      border-radius: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

      left: 50%;

      top: 100%;

      box-shadow:
        0 0 15px rgba(255,255,255,0.8);
    }

    .intensity-display {
      margin-top: 15px;

      font-size: 18px;

      color: #ccc;
    }

    #currentIntensity {
      color: white;

      font-weight: bold;
    }
  </style>

</head>

<body>

  <div class="controller">

  </div>

<script>

const BACKEND_URL =
  "https://torture-controller.onrender.com";

const PLATFORM =
  "LiasLittleTorture";


// --------------------------------
// ELEMENTS
// --------------------------------

const statusElement =
  document.getElementById("status");

const qrContainer =
  document.getElementById("qrContainer");

const qrCode =
  document.getElementById("qrCode");

const tracePad =
  document.getElementById("tracePad");

const traceIndicator =
  document.getElementById("traceIndicator");

const currentIntensityElement =
  document.getElementById("currentIntensity");


// --------------------------------
// LOVENSE STATE
// --------------------------------

let socket = null;

let ackId = null;

let connectedToyId = null;


// --------------------------------
// TRACE STATE
// --------------------------------

let isTouching = false;

let targetIntensity = 0;

let currentIntensity = 0;

let lastSentIntensity = -1;

let lastCommandTime = 0;


// How often we send commands
// to Lovense

const COMMAND_INTERVAL = 120;


// How much intensity must change
// before sending another command

const INTENSITY_DEADZONE = 1;


// --------------------------------
// SEND TOY COMMAND
// --------------------------------

function sendToyCommand(intensity) {

  if (!socket) {
    return;
  }


  const toyCommand = {

    command:
      "Function",

    action:
      `Vibrate:${intensity}`,

    timeSec:
      0,

    apiVer:
      1

  };


  console.log(
    "Lovense command:",
    intensity
  );


  socket.emit(
    "basicapi_send_toy_command_ts",
    toyCommand
  );

}


// --------------------------------
// CONNECT LOVENSE
// --------------------------------

async function connectLovense() {

  statusElement.textContent =
    "Getting Lovense authentication...";


  const uid =
    "user-" +
    Math.random()
      .toString(36)
      .substring(2, 12);


  try {

    // ------------------------------
    // AUTH TOKEN
    // ------------------------------

    const authResponse =
      await fetch(
        `${BACKEND_URL}/auth-token`,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              uid:
                uid

            })

        }
      );


    const authData =
      await authResponse.json();


    console.log(
      "Auth response:",
      authData
    );


    if (
      authData.code !== 0 ||
      !authData.data?.authToken
    ) {

      statusElement.textContent =
        "Authentication failed ❌";

      return;

    }


    const authToken =
      authData.data.authToken;


    // ------------------------------
    // GET SOCKET INFORMATION
    // ------------------------------

    statusElement.textContent =
      "Getting Lovense connection...";


    const socketResponse =
      await fetch(
        "https://api.lovense-api.com/api/basicApi/getSocketUrl",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              platform:
                PLATFORM,

              authToken:
                authToken

            })

        }
      );


    const socketData =
      await socketResponse.json();


    console.log(
      "Socket response:",
      socketData
    );


    if (
      socketData.code !== 0
    ) {

      statusElement.textContent =
        "Socket setup failed ❌";

      return;

    }


    // ------------------------------
    // CONNECT SOCKET
    // ------------------------------

    statusElement.textContent =
      "Opening Lovense connection...";


    const socketInfo =
      socketData.data;


    socket =
      io(
        socketInfo.socketIoUrl,
        {

          path:
            socketInfo.socketIoPath,

          transports:
            ["websocket"]

        }
      );


    // ------------------------------
    // SOCKET CONNECTED
    // ------------------------------

    socket.on(
      "connect",
      () => {

        console.log(
          "Lovense Socket connected!"
        );


        statusElement.textContent =
          "Lovense connected ✅";


        // Request QR code

        ackId =
          Math.random()
            .toString(36)
            .substring(2, 20);


        socket.emit(
          "basicapi_get_qrcode_ts",
          {

            ackId:
              ackId

          }
        );

      }
    );


    // ------------------------------
    // QR CODE
    // ------------------------------

    socket.on(
      "basicapi_get_qrcode_tc",
      (res) => {

        const resData =
          res
            ? JSON.parse(res)
            : {};


        console.log(
          "QR response:",
          resData
        );


        if (
          resData.data &&
          resData.data.ackId === ackId
        ) {

          qrCode.src =
            resData.data.qrcodeUrl;


          qrContainer.style.display =
            "block";


          statusElement.textContent =
            "QR ready — scan with Lovense Remote 📱";

        }

      }
    );


    // ------------------------------
    // DEVICE CONNECTED
    // ------------------------------

    socket.on(
      "basicapi_update_device_info_tc",
      (res) => {

        const deviceInfo =
          res
            ? JSON.parse(res)
            : {};


        console.log(
          "Device information:",
          deviceInfo
        );


        if (
          deviceInfo.toyList &&
          deviceInfo.toyList.length > 0
        ) {

          connectedToyId =
            deviceInfo.toyList[0].id;


          statusElement.textContent =
            "Toy connected ✅";


          console.log(
            "Connected toy:",
            deviceInfo.toyList[0]
          );

        }

      }
    );


    // ------------------------------
    // DISCONNECTED
    // ------------------------------

    socket.on(
      "disconnect",
      () => {

        connectedToyId =
          null;


        statusElement.textContent =
          "Lovense disconnected ❌";

      }
    );


    // ------------------------------
    // SOCKET ERROR
    // ------------------------------

    socket.on(
      "connect_error",
      (error) => {

        console.error(
          "Lovense Socket error:",
          error
        );


        statusElement.textContent =
          "Lovense Socket error ❌";

      }
    );


  } catch (error) {

    console.error(
      "Connection error:",
      error
    );


    statusElement.textContent =
      "Connection error ❌";

  }

}


// --------------------------------
// SMOOTH FINGER TRACE
// --------------------------------

let isTouching = false;

let targetIntensity = 0;
let currentIntensity = 0;

let lastSentIntensity = -1;
let lastCommandTime = 0;


// --------------------------------
// UPDATE FINGER POSITION
// --------------------------------

function updateTrace(event) {

  if (!isTouching) {
    return;
  }

  const rect =
    tracePad.getBoundingClientRect();


  let x =
    event.clientX -
    rect.left;

  let y =
    event.clientY -
    rect.top;


  // Keep finger inside the pad

  x =
    Math.max(
      0,
      Math.min(
        rect.width,
        x
      )
    );

  y =
    Math.max(
      0,
      Math.min(
        rect.height,
        y
      )
    );


  // Convert position to percentage

  const percentX =
    (x / rect.width) * 100;

  const percentY =
    (y / rect.height) * 100;


  // Move visual dot

  traceIndicator.style.left =
    `${percentX}%`;

  traceIndicator.style.top =
    `${percentY}%`;


  // --------------------------------
  // INTENSITY
  // --------------------------------

  // Top = maximum
  // Bottom = minimum

  targetIntensity =
    (
      1 -
      percentY / 100
    ) * 20;

}


// --------------------------------
// FINGER DOWN
// --------------------------------

tracePad.addEventListener(
  "pointerdown",
  (event) => {

    isTouching =
      true;

    tracePad.setPointerCapture(
      event.pointerId
    );

    updateTrace(event);

  }
);


// --------------------------------
// FINGER / MOUSE MOVEMENT
// --------------------------------

tracePad.addEventListener(
  "pointermove",
  (event) => {

    updateTrace(event);

  }
);


// --------------------------------
// FINGER RELEASE
// --------------------------------

tracePad.addEventListener(
  "pointerup",
  (event) => {

    isTouching =
      false;

    targetIntensity =
      0;

    tracePad.releasePointerCapture(
      event.pointerId
    );

  }
);


// --------------------------------
// CANCEL / LEAVE
// --------------------------------

tracePad.addEventListener(
  "pointercancel",
  () => {

    isTouching =
      false;

    targetIntensity =
      0;

  }
);


// --------------------------------
// ULTRA SMOOTH INTENSITY ENGINE
// --------------------------------

function smoothTrace() {

  // Smoothly approach target intensity

  const difference =
    targetIntensity -
    currentIntensity;


  currentIntensity +=
    difference *
    0.08;


  // Round only when sending

  const intensity =
    Math.round(
      currentIntensity
    );


  const now =
    performance.now();


  // Send updates every 100ms

  if (
    socket &&
    connectedToyId &&
    now -
    lastCommandTime >=
    100 &&
    intensity !==
    lastSentIntensity
  ) {

    lastCommandTime =
      now;

    lastSentIntensity =
      intensity;


    sendToyCommand(
      intensity
    );

  }


  // Continue animation

  requestAnimationFrame(
    smoothTrace
  );

}


// Start smooth engine

smoothTrace();


// --------------------------------
// CONNECT BUTTON
// --------------------------------

document
  .getElementById("connectButton")
  .addEventListener(
    "click",
    connectLovense
  );

</script>

</body>
</html>
