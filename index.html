<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Lovense Finger Controller</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/2.5.0/socket.io.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .controller {
      width: 100%;
      max-width: 500px;

      background: #1c1c1c;

      border-radius: 20px;

      padding: 25px;

      text-align: center;
    }

    h1 {
      margin-top: 0;
    }

    .status {
      margin: 20px 0;

      padding: 12px;

      border-radius: 10px;

      background: #2a2a2a;
    }

    #connectButton {
      width: 100%;

      padding: 15px;

      margin-top: 10px;

      border: none;

      border-radius: 12px;

      font-size: 16px;

      cursor: pointer;
    }

    #connectButton:active {
      transform: scale(0.97);
    }

    #qrContainer {
      display: none;

      margin: 20px 0;
    }

    #qrCode {
      width: 250px;

      max-width: 100%;

      background: white;

      padding: 10px;

      border-radius: 10px;
    }

    .trace-container {
      margin-top: 30px;
    }

    .trace-pad {
      position: relative;

      width: 100%;

      height: 350px;

      background: #2a2a2a;

      border-radius: 20px;

      border: 2px solid #444;

      touch-action: none;

      overflow: hidden;

      cursor: crosshair;

      user-select: none;

      -webkit-user-select: none;
    }

    .trace-indicator {
      position: absolute;

      width: 34px;

      height: 34px;

      background: white;

      border-radius: 50%;

      transform:
        translate(-50%, -50%);

      pointer-events: none;

      left: 50%;

      top: 100%;

      box-shadow:
        0 0 15px rgba(255,255,255,0.8);
    }

    .trace-label {
      margin-bottom: 12px;

      color: #ccc;
    }

    .intensity-display {
      margin-top: 15px;

      font-size: 18px;

      color: #ccc;
    }

    #currentIntensity {
      color: white;

      font-weight: bold;
    }
  </style>

</head>

<body>

  <div class="controller">

```

```

  </div>

<script>

const BACKEND_URL =
  "https://torture-controller.onrender.com";

const PLATFORM =
  "LiasLittleTorture";


const statusElement =
  document.getElementById("status");

const qrContainer =
  document.getElementById("qrContainer");

const qrCode =
  document.getElementById("qrCode");

const tracePad =
  document.getElementById("tracePad");

const traceIndicator =
  document.getElementById("traceIndicator");

const currentIntensityElement =
  document.getElementById("currentIntensity");

const connectButton =
  document.getElementById("connectButton");


let socket = null;

let ackId = null;

let connectedToyId = null;


// ======================================
// SEND TOY COMMAND
// ======================================

function sendToyCommand(
  intensity
) {

  if (
    !socket ||
    !connectedToyId
  ) {

    return;

  }


  const safeIntensity =
    Math.max(
      0,
      Math.min(
        20,
        Math.round(intensity)
      )
    );


  const toyCommand = {

    toy:
      connectedToyId,

    command:
      "Function",

    action:
      `Vibrate:${safeIntensity}`,

    timeSec:
      20,

    apiVer:
      1

  };


  console.log(
    "Sending toy command:",
    toyCommand
  );


  socket.emit(
    "basicapi_send_toy_command_ts",
    toyCommand
  );

}


// ======================================
// CONNECT LOVENSE
// ======================================

async function connectLovense() {

  statusElement.textContent =
    "Getting Lovense authentication...";


  const uid =
    "user-" +
    Math.random()
      .toString(36)
      .substring(2, 12);


  try {

    // STEP 1
    // Get authentication token

    const authResponse =
      await fetch(
        `${BACKEND_URL}/auth-token`,
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              uid:
                uid

            })

        }
      );


    const authData =
      await authResponse.json();


    console.log(
      "Auth response:",
      authData
    );


    if (
      authData.code !== 0 ||
      !authData.data?.authToken
    ) {

      statusElement.textContent =
        "Authentication failed ❌";

      return;

    }


    const authToken =
      authData.data.authToken;


    // STEP 2
    // Get Socket information

    statusElement.textContent =
      "Getting Lovense connection...";


    const socketResponse =
      await fetch(
        "https://api.lovense-api.com/api/basicApi/getSocketUrl",
        {

          method:
            "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({

              platform:
                PLATFORM,

              authToken:
                authToken

            })

        }
      );


    const socketData =
      await socketResponse.json();


    console.log(
      "Socket response:",
      socketData
    );


    if (
      socketData.code !== 0
    ) {

      statusElement.textContent =
        "Socket setup failed ❌";

      return;

    }


    // STEP 3
    // Connect Socket

    statusElement.textContent =
      "Opening Lovense connection...";


    const socketInfo =
      socketData.data;


    socket =
      io(
        socketInfo.socketIoUrl,
        {

          path:
            socketInfo.socketIoPath,

          transports:
            ["websocket"]

        }
      );


    // Socket connected

    socket.on(
      "connect",
      () => {

        console.log(
          "Lovense Socket connected!"
        );


        statusElement.textContent =
          "Lovense connected ✅";


        // STEP 4
        // Request QR code

        ackId =
          Math.random()
            .toString(36)
            .substring(2, 20);


        socket.emit(
          "basicapi_get_qrcode_ts",
          {

            ackId:
              ackId

          }
        );

      }
    );


    // Receive QR code

    socket.on(
      "basicapi_get_qrcode_tc",
      (res) => {

        const resData =
          res
            ? JSON.parse(res)
            : {};


        console.log(
          "QR response:",
          resData
        );


        if (
          resData.data &&
          resData.data.ackId === ackId
        ) {

          qrCode.src =
            resData.data.qrcodeUrl;


          qrContainer.style.display =
            "block";


          statusElement.textContent =
            "QR code ready — scan with Lovense Remote 📱";

        }

      }
    );


    // STEP 5
    // Detect connected toy

    socket.on(
      "basicapi_update_device_info_tc",
      (res) => {

        const deviceInfo =
          res
            ? JSON.parse(res)
            : {};


        console.log(
          "Device information:",
          deviceInfo
        );


        if (
          deviceInfo.toyList &&
          deviceInfo.toyList.length > 0
        ) {

          connectedToyId =
            deviceInfo.toyList[0].id;


          statusElement.textContent =
            "Toy connected ✅";


          console.log(
            "Connected toy:",
            deviceInfo.toyList[0]
          );

        }

      }
    );


    // Socket disconnected

    socket.on(
      "disconnect",
      () => {

        connectedToyId =
          null;


        statusElement.textContent =
          "Lovense disconnected ❌";

      }
    );


    // Socket error

    socket.on(
      "connect_error",
      (error) => {

        console.error(
          "Lovense Socket error:",
          error
        );


        statusElement.textContent =
          "Lovense Socket error ❌";

      }
    );


  } catch (error) {

    console.error(
      "Connection error:",
      error
    );


    statusElement.textContent =
      "Connection error ❌";

  }

}


// ======================================
// FINGER TRACE CONTROLLER
// ======================================

let isTouching =
  false;

let targetIntensity =
  0;

let currentIntensity =
  0;

let lastCommandTime =
  0;


// ======================================
// UPDATE FINGER POSITION
// ======================================

function updateFingerPosition(
  event
) {

  const rect =
    tracePad.getBoundingClientRect();


  const x =
    event.clientX -
    rect.left;

  const y =
    event.clientY -
    rect.top;


  const percentX =
    Math.max(
      0,
      Math.min(
        100,
        (x / rect.width) * 100
      )
    );


  const percentY =
    Math.max(
      0,
      Math.min(
        100,
        (y / rect.height) * 100
      )
    );


  // Move visual indicator

  traceIndicator.style.left =
    `${percentX}%`;

  traceIndicator.style.top =
    `${percentY}%`;


  // Convert vertical position
  // into intensity

  targetIntensity =
    20 -
    (
      percentY /
      100
    ) *
    20;

}


// ======================================
// FINGER DOWN
// ======================================

tracePad.addEventListener(
  "pointerdown",
  (event) => {

    event.preventDefault();


    isTouching =
      true;


    tracePad.setPointerCapture(
      event.pointerId
    );


    updateFingerPosition(
      event
    );

  }
);


// ======================================
// FINGER MOVE
// ======================================

tracePad.addEventListener(
  "pointermove",
  (event) => {

    if (
      !isTouching
    ) {

      return;

    }


    event.preventDefault();


    updateFingerPosition(
      event
    );

  }
);


// ======================================
// FINGER UP
// ======================================

function stopFingerTrace() {

  isTouching =
    false;


  targetIntensity =
    0;


  sendToyCommand(
    0
  );


  currentIntensity =
    0;


  currentIntensityElement.textContent =
    "0";


  traceIndicator.style.left =
    "50%";

  traceIndicator.style.top =
    "100%";

}


// Pointer released

tracePad.addEventListener(
  "pointerup",
  (event) => {

    event.preventDefault();

    stopFingerTrace();

  }
);


// Pointer cancelled

tracePad.addEventListener(
  "pointercancel",
  () => {

    stopFingerTrace();

  }
);


// Pointer leaves while captured

tracePad.addEventListener(
  "lostpointercapture",
  () => {

    if (
      isTouching
    ) {

      stopFingerTrace();

    }

  }
);


// ======================================
// SMOOTH INTENSITY LOOP
// ======================================

function smoothTrace() {

  if (
    isTouching
  ) {

    currentIntensity +=
      (
        targetIntensity -
        currentIntensity
      ) *
      0.25;


    const roundedIntensity =
      Math.round(
        currentIntensity
      );


    currentIntensityElement.textContent =
      roundedIntensity;


    const now =
      Date.now();


    // Send command every 100ms

    if (
      socket &&
      connectedToyId &&
      now -
      lastCommandTime >=
      100
    ) {

      lastCommandTime =
        now;


      sendToyCommand(
        roundedIntensity
      );

    }

  }


  requestAnimationFrame(
    smoothTrace
  );

}


smoothTrace();


// ======================================
// CONNECT BUTTON
// ======================================

connectButton.addEventListener(
  "click",
  connectLovense
);

</script>

</body>
</html>
